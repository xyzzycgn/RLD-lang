
[controls]
viirld-pause-key=Пауза/продолжить

[entity-description]
viirld-dispatcher=В железнодорожной логистике активирована близлежащая станция.\nПодключите сигнал с содержимым станции к входному порту.\nКогда поезд остановится, на выходной порт будет отправлен сигнал с информацией о доставке.

[entity-name]
viirld-dispatcher=Диспетчер ж/д логистики

[mod-description]
viirld=Добавляет диспетчер (здание) для автоматизации железнодорожной логистики на основе станций снабжения и запроса.\n\nИмеет интуитивный интерфейс. Был вдохновлен LTN, но пошёл другим путём.

[mod-name]
viirld=Диспетчер ж/д логистики 2 (бета)

[mod-setting-description]
viirld-correctScheduleAtProvider=По прибытии на станцию снабжения доставка может быть скорректирована с учетом изменений в поставках и запросах, произошедших за время следования поезда к станции.
viirld-countingInsertersContent=При расчёте содержимого станций учитывается входящий сигнал и содержимое поезда.\nЭто иногда приводит к скачкам содержимого во время загрузки или выгрузки, поскольку часть груза некоторое время находится в манипуляторах.\nДанная опция включает учёт содержимого манипуляторов.
viirld-debug=Включает некоторые отладочные сообщения и индикаторы.
viirld-load-or-cond-full=Добавить условие "ИЛИ полная загрузка" на станции снабжения.\n\nЭтот параметр противоречит замыслу мода и автор не рекомендует его включать.
viirld-minEnergyUseTrainMJ=Минимальное количество запаса энергии в поезде, которое можно использовать для доставки.\nПоезд с запасом энергии меньше указанного не будет использоваться для доставки; он останется в депо.\nУказывается в мегаджоулях (МДж)\n\nНапример: 100 МДж = 25 угля.
viirld-pauseNewDispatchers=Поставить на паузу вновь установленные диспетчеры, если они имеют настройки (скопированные или воссозданные из их призрака).\n\nЭто может предотвратить создание доставок для вновь скопированного диспетчера.
viirld-set-train-group=По прибытии в депо поезду будет присвоена группа, название которой совпадает с названием станции депо.\n\nВо время доставки поезд покидает группу и возвращается к ней снова в депо.
viirld-unload-or-cond-zeros=Добавить условие "ИЛИ ? = 0" для каждого предмета или жидкости на станциях запроса.\n\nЭтот параметр противоречит замыслу мода, и автор не рекомендует его включать.
viirld-updateTicks=Обновление станции - это пересчёт её содержимого, настроек, запросов и поставок.\n\nМеньшее значение - более частое обновление, больше нагрузка на процессор.\n\nПримечание: каждая станция обновляется не чаще, чем раз в 60 тиков.
viirld-use-hack-to-save-interrupts=В Lua API нет возможности сохранить или изменить прерывания поездов - они просто удаляются при изменении расписания.\n\nПока Factorio не добавит такую возможность, можно использовать обходной путь (хак).\n\nНекоторые моды могут помешать этому хаку, поэтому он может работать ненадёжно.

[mod-setting-name]
viirld-correctScheduleAtProvider=Настроить доставки
viirld-countingInsertersContent=Включить содержимое манипуляторов
viirld-debug=Отладка
viirld-load-or-cond-full=Добавить условие "ИЛИ полная загрузка"
viirld-minEnergyUseTrainMJ=Минимальная энергия поезда (МДж)
viirld-pauseNewDispatchers=Пауза для новых диспетчеров
viirld-set-train-group=Установить группу поездов в депо
viirld-unload-or-cond-zeros=Добавить условия "ИЛИ ? = 0"
viirld-updateTicks=Интервал обновления (тиков)
viirld-use-hack-to-save-interrupts=Сохранить прерывания (хак)

[technology-description]
viirld-dispatcher=Автоматизирует железнодорожную логистику, объединяя станции снабжения, станции запросов и поезда в единую автоматизированную сеть.

[technology-name]
viirld-dispatcher=Диспетчер ж/д логистики

[viirld-gui]
ANY_FLUID_BY_SIGNALS=Жидкость по сигналам:
ANY_ITEM_BY_SIGNALS=Груз по сигналам:
EL_ALLOW_ANY_FLUID_PROVIDE=[item=passive-provider-chest] Снабжение
EL_ALLOW_ANY_FLUID_PROVIDE-tt=Станция будет подавать жидкости в зависимости от сигнала на входном порту диспетчера.\nОн должен быть больше нуля (>0).\n\nВходной порт должен быть подключён к резервуарам станции.
EL_ALLOW_ANY_FLUID_REQUEST=[item=requester-chest] Запрос
EL_ALLOW_ANY_FLUID_REQUEST-tt=Станция будет запрашивать жидкости в зависимости от сигнала на входном порту диспетчера.\nДля запроса он должен быть меньше нуля (<0).\n\nВходной порт должен быть подключён к резервуарам станции.\n\nМинимальная настройка (общая для всех жидкостей) позволит вам перевозить не менее указанного значения за одну поставку.
EL_ALLOW_ANY_ITEM_PROVIDE=[item=passive-provider-chest] Снабжение
EL_ALLOW_ANY_ITEM_PROVIDE-tt=Станция будет поставлять грузы в зависимости от сигнала на входном порту диспетчера.\nОн должен быть больше нуля (>0).\n\nВходной порт должен быть подключён к сундукам станции.
EL_ALLOW_ANY_ITEM_REQUEST=[item=requester-chest] Запрос
EL_ALLOW_ANY_ITEM_REQUEST-tt=Станция будет запрашивать груз в зависимости от сигнала на входном порту диспетчера.\nДля запроса он должен быть меньше нуля (<0).\n\nВходной порт должен быть подключён к сундукам станции.\n\nМинимальная настройка (общая для всех грузов) позволит вам перевозить не менее указанного значения за одну доставку.\n\nНапример, минимум 50 пачек: поставка будет создана, если:\n- на станции запроса не хватает 50 или более пачек ресурса,\n- на станции снабжения есть 50 или более пачек ресурса,\n- доступен поезд соответствующей вместимости.
EL_APPLY=Применить
EL_CARGO_STAT_TABLE-H-COUNT=Доставки
EL_CARGO_STAT_TABLE-H-LASTTIME=Последний раз
EL_CARGO_STAT_TABLE-H-RECV=Получено
EL_CARGO_STAT_TABLE-H-SENT=Отправлено
EL_CARGO_STAT_TABLE-TITLE=Статистика
EL_DELETE_DELIVERY-tt=Удалить доставку.\n\nЗаставляет диспетчера забыть об этой доставке. Не влияет на поезд - он, если он есть, продолжает следовать по маршруту.
EL_DELIVERIES_TABLE-H-FROM=Из
EL_DELIVERIES_TABLE-H-TIME=Время
EL_DELIVERIES_TABLE-H-TO=В
EL_DELIVERIES_TABLE-TITLE=Доставки
EL_ERR_TABLE-H-ERROR=Ошибка
EL_ERR_TABLE-H-TIME=Время
EL_IO_TABLE-H-BALANCE=Баланс
EL_IO_TABLE-H-ON_STATION=На станции
EL_IO_TABLE-H-ON_WAY=В пути
EL_IO_TABLE-TITLE=[color=__1__]Запросы−[/color] и [color=__2__]снабжение+[/color]
EL_ITEM_ALLOW_PROVIDE=[item=passive-provider-chest] Снабжение
EL_ITEM_ALLOW_PROVIDE-tt=Станция будет поставлять выбранный ресурс.\n\nКоличество снабжения определяется сигналом, поступающим на входной порт диспетчера.\nОн должен быть подключён к сундукам и/или резервуарам станции.
EL_ITEM_ALLOW_REQUEST=[item=requester-chest] Запрос:
EL_ITEM_ALLOW_REQUEST-tt=Станция будет запрашивать выбранный ресурс.\n\nКоличество запроса определяется указанным параметром и сигналом на входном порту диспетчера.\nОн должен быть подключён к сундукам и/или резервуарам станции.\n\nУстановка минимума позволит вам перевозить не менее указанного значения за одну поставку. \n\nНапример, минимум 50 пачек: доставка будет создана, если:\n- на станции запроса не хватает 50 или более пачек ресурса,\n- на станции снабжения есть 50 или более пачек ресурса,\n- доступен поезд соответствующего размера.
EL_ITEM_BUTTON-ANY-tt=Кнопка для настройки параметров на основе сигналов, поступающих на входной порт диспетчера.\n\nЕсли подан отрицательный (< 0) сигнал груза или жидкости, станция будет запрашивать этот ресурс.\nЕсли положительный (> 0), предлагать.\nЕсли соответствующие настройки включены.
EL_ITEM_BUTTON-tt=Выберите предмет или жидкость, затем задайте параметры запроса или предложения.\n\nВ зависимости от настроек станция будет запрашивать или предлагать выбранный ресурс в железнодорожной сети.
EL_ITEM_MEM_BUTTON=Память:
EL_ITEM_MEM_BUTTON-tt=Щёлкните левой кнопкой мыши, удерживая Ctrl, Alt или Shift, чтобы сохранить настройки элемента в ячейке.\nПросто щёлкните левой кнопкой мыши, чтобы применить сохранённые настройки.\nЩёлкните правой кнопкой мыши, чтобы очистить ячейку.
EL_ITEM_MIN=Мин:
EL_ITEM_MIN-tt=Станция будет запрашивать выбранный ресурс.\n\nКоличество запроса определяется указанным параметром и сигналом на входном порту диспетчера.\nОн должен быть подключён к сундукам и/или резервуарам станции.\n\nУстановка минимума позволит вам перевозить не менее указанного значения за одну поставку. \n\nНапример, минимум 50 пачек: доставка будет создана, если:\n- на станции запроса не хватает 50 или более пачек ресурса,\n- на станции снабжения есть 50 или более пачек ресурса,\n- доступен поезд соответствующего размера.
EL_ITEM_REQUEST-tt=Станция будет запрашивать выбранный ресурс.\n\nКоличество запроса определяется указанным параметром и сигналом на входном порту диспетчера.\nОн должен быть подключён к сундукам и/или резервуарам станции.\n\nУстановка минимума позволит вам перевозить не менее указанного значения за одну поставку. \n\nНапример, минимум 50 пачек: доставка будет создана, если:\n- на станции запроса не хватает 50 или более пачек ресурса,\n- на станции снабжения есть 50 или более пачек ресурса,\n- доступен поезд соответствующего размера.
EL_LEN=Вагоны:
EL_LEN-tt=Ограничение длины поезда для этой станции: "от"-"до" - включительно.\n\nНапример, если вы укажете "2"-"3", то доставка с этой станции будет осуществляться только поездами с двумя или тремя вагонами, включая локомотивы.\nВы можете опустить некоторые значения: " "-"3" - один, два или три элемента.
EL_MIN_ANY_FLUID=Мин:
EL_MIN_ANY_FLUID-tt=Станция будет запрашивать жидкости в зависимости от сигнала на входном порту диспетчера.\nДля запроса он должен быть меньше нуля (<0).\n\nВходной порт должен быть подключён к резервуарам станции.\n\nМинимальная настройка (общая для всех жидкостей) позволит вам перевозить не менее указанного значения за одну поставку.
EL_MIN_ANY_ITEM=Мин:
EL_MIN_ANY_ITEM-tt=Станция будет запрашивать груз в зависимости от сигнала на входном порту диспетчера.\nДля запроса он должен быть меньше нуля (<0).\n\nВходной порт должен быть подключён к сундукам станции.\n\nМинимальная настройка (общая для всех грузов) позволит вам перевозить не менее указанного значения за одну доставку.\n\nНапример, минимум 50 пачек: поставка будет создана, если:\n- на станции запроса не хватает 50 или более пачек ресурса,\n- на станции снабжения есть 50 или более пачек ресурса,\n- доступен поезд соответствующей вместимости.
EL_MODE_DEPOT=[item=locomotive] Депо
EL_MODE_DEPOT-tt=В депо поезда ждут заданий по доставке и заправляются.\n\nПоезд всегда приходит в депо с тем же названием, из которого он вышел, находя его по названию станции.\n\nЕсли вы хотите иметь разные депо для разных типов поездов, назовите их по-разному.\n\nЕсли у поезда небольшой запас топлива или груз в вагонах, он будет стоять и ждать, пока его заправят и опустошат.
EL_MODE_ENDPOINT=[item=passive-provider-chest] Снабжение / [item=requester-chest] Запрос
EL_MODE_ENDPOINT-tt=В зависимости от настроек и сигналов материалов станция становится участником задач по доставке.\n\nДля каждого типа груза (твёрдого или жидкого) можно включить режим запроса или снабжения.\n\nТакже можно настроить общий режим [virtual-signal=signal-anything] - запрос (<0) и предложение (>0) будут браться из сигнала на входном порту диспетчера.\n\nКогда в сети появляются две станции с одинаковыми запросом и снабжением, доставка создаётся, если есть подходящий поезд.
EL_MODE_LIQUIDATION=[item=active-provider-chest] Ликвидация
EL_MODE_LIQUIDATION-tt=Аналогичен режиму «[item=passive-provider-chest] Снабжение / [item=requester-chest] Запрос», но со следующими изменениями:\n- Запрос на этой станции отключён;\n- Приоритет поставки самый высокий;\n- При запросе груза с этой станции на других станциях, он будет игнорироваться при минимуме.\n\nИспользуется для выгрузки груза со станции, готовой к уничтожению.
EL_MODE_OFF=Выкл
EL_MODE_OFF-tt=Диспетчер не будет управлять этой станцией.
EL_NETWORK=Сеть:
EL_NETWORK-tt=Вы можете указать сеть этой станции. Например: 1, 2, ...\n\nКаждая сеть изолирована: доставки организованы в пределах одной сети. Однако поезда являются общими.
EL_OUT_MODE_EXCHANGE=Вывод требуемого обмена
EL_OUT_MODE_EXCHANGE-tt=В выходном порту будет отображаться груз, который нужно загрузить (>0) или выгрузить (<0), чтобы отправить поезд.\n\nНапример, на станции снабжения будет отображаться загруженный груз со знаком плюс. А станция запроса отобразит то же самое, но со знаком минус.\n\nПримечание: опция «Обратить вывод» может изменить знак: загрузить - <0 и разгрузить - >0.\n\nНа выходной порт также посылаются следующие сигналы:\n[virtual-signal=signal-P] - Когда есть поезд, если это станция снабжения. От слова Provider.\n[virtual-signal=signal-R] - При появлении поезда, если это станция запроса. От слова Requester.\n[virtual-signal=signal-E] - Когда есть ошибки (Error).\n[virtual-signal=signal-D] - Количество активных поставок с этой станции (Deliveries).\n[virtual-signal=signal-L] - Длина поезда, включая локомотивы (Length).\n[virtual-signal=signal-C] - Количество грузовых вагонов (Cargo).\n[virtual-signal=signal-F] - Количество цистерн (Fluid).
EL_OUT_MODE_NEGATE=Обратить вывод
EL_OUT_MODE_NEGATE-tt=Меняет знак на выходном порту.\n\nДля режима «Вывод требуемого содержимого» содержимое поезда, необходимое для отправки, будет со знаком минус.\nА для режима «Вывод требуемого обмена» знаки изменятся: загрузка - <0 и выгрузка - >0.
EL_OUT_MODE_TARGET_CONTENTS=Вывод требуемого содержимого
EL_OUT_MODE_TARGET_CONTENTS-tt=На выходном порту будет отображаться содержимое поезда, которое необходимо отправить.\n\nНапример, на станции снабжения будет отображаться груз, который загружается. А станция запроса будет пустой - в поезде ничего не должно остаться.\n\nНа выходной порт также посылаются следующие сигналы:\n[virtual-signal=signal-P] - Когда есть поезд, если это станция снабжения. От слова Provider.\n[virtual-signal=signal-R] - При появлении поезда, если это станция запроса. От слова Requester.\n[virtual-signal=signal-E] - Когда есть ошибки (Error).\n[virtual-signal=signal-D] - Количество активных поставок с этой станции (Deliveries).\n[virtual-signal=signal-L] - Длина поезда, включая локомотивы (Length).\n[virtual-signal=signal-C] - Количество грузовых вагонов (Cargo).\n[virtual-signal=signal-F] - Количество цистерн (Fluid).
EL_PAUSE=Пауза
EL_PAUSE-paused=[virtual-signal=viirld-delivery-pause] Снять с паузы
EL_PAUSE-tt=Это приостановит создание доставок на этой станции.\n\nВ настройках вы можете включить или отключить автоматическую приостановку новых диспетчеров.\n\nАвтоматическая приостановка может быть сделана с помощью сигнала [virtual-signal=viirld-delivery-pause].\n\nВы не можете отменить приостановку с помощью кнопки, если она установлена с помощью сигнала.
EL_ROLLBACK=Откатить
EL_STATION_TEMPLATE=Название станции:
EL_STATION_TEMPLATE-tt=Шаблон для автоматического наименования станций.\n\nДля режимов «[item=passive-provider-chest] Снабжение / [item=requester-chest] Запрос» или «[item=active-provider-chest] Ликвидация» в поле могут использоваться подстановки:\n- %d - соответствует числу. Будет заменено на любое число, чтобы название станции стало уникальным;\n- %s - соответствует любой строке. Будет заменено на «блабла%d», чтобы название станции стало уникальным;\n- %x - будет заменено на x-координату станции;\n- %y - будет заменено на y-координату станции;\n- %u - будет заменено на уникальный идентификатор станции.\n\nДля «[item=locomotive] Депо» нет подстановок.\n\nПримите во внимание, что если название станции уже соответствует шаблону, то переименование не произойдет, например,\n- если станция уже называется «[item=iron-plate] Железногорск» (и других станций с таким названием нет), то с шаблоном «[item=iron-plate] %s» переименование в «[item=железо-плита] блабла1» не произойдет.\n\nПримеры: \n- Шаблон «[item=iron-plate] %d» → «[item=iron-plate] 1» или «[item=iron-plate] 2», ...\n- Шаблон «[item=iron-plate] %s» → «[item=iron-plate] блабла1» или «[item=iron-plate] блабла2», . ..\n- Шаблон «[item=iron-plate] %xx%y» → «[item=iron-plate] 45x76»\n- Шаблон «[item=iron-plate]» → «[item=iron-plate]1» - нет %d или %s, поэтому номер добавляется справа.\n\nЕсли пусто, диспетчер не обновляет название станции.
EL_STAT_TRAINS=Поезда были здесь: __1__
FLAG_turnInserters=Повернуть манипуляторы
FLAG_turnInserters-tt=Иногда при отправке поезда что-то может остаться в манипуляторах. Эта опция временно развернет манипуляторы при отправке поезда, чтобы положить предмет обратно в сундук.
FLAG_useEquals=Равенство в расписании
FLAG_useEquals-tt=По умолчанию расписания используют нестрогое сравнение (>=). Этот параметр позволяет использовать строгое сравнение (=). Это может быть полезно для более точных погрузок.
FLAG_useSignals=Режим сигналов
